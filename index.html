  <style>
    body { font-family: sans-serif; margin: 24px; }

<body>
  <div class="grid" id="buttons"></div>

  <script>
    const programs = {"1":"import matplotlib.pyplot as plt\r\nfrom sklearn.datasets import fetch_california_housing\r\n\r\ndf = fetch_california_housing(as_frame=True).frame\r\n\r\n\r\ndf.hist(figsize=(12,8))\r\nplt.show()\r\n\r\n\r\ndf.plot(kind=\"box\", subplots=True, layout=(3,3), figsize=(12,8))\r\nplt.show()\r\n\r\n\r\nfor c in df:\r\n    q1,q3 = df[c].quantile([0.25,0.75])\r\n    i = q3-q1\r\n    print(c, len(df[(df[c]\u003cq1-1.5*i)|(df[c]\u003eq3+1.5*i)]))\r\n\r\nprint(df.describe())","2":"import seaborn as sns, matplotlib.pyplot as plt\r\nfrom sklearn.datasets import fetch_california_housing\r\n\r\ndf = fetch_california_housing(as_frame=True).frame\r\n\r\n\r\nsns.heatmap(df.corr(), annot=True, cmap=\"coolwarm\")\r\nplt.show()\r\n\r\n\r\nsns.pairplot(df)\r\nplt.show()","3":"import matplotlib.pyplot as plt\r\nfrom sklearn.datasets import load_iris\r\nfrom sklearn.decomposition import PCA\r\n\r\nx,y = load_iris(return_X_y=True)\r\n\r\np = PCA(2).fit_transform(x)\r\n\r\nplt.scatter(p[:,0], p[:,1], c=y)\r\nplt.xlabel(\"PC1\")\r\nplt.ylabel(\"PC2\")\r\nplt.title(\"Iris PCA\")\r\nplt.show()","4":"import pandas as pd\r\n\r\ndf = pd.read_csv(\"training_data.csv\")\r\nh = [\u00270\u0027]*(len(df.columns)-1)\r\n\r\nfor _,r in df.iterrows():\r\n    if r.iloc[-1]==\"Yes\":\r\n        for i,j in enumerate(r[:-1]):\r\n            h[i] = j if h[i] in [\u00270\u0027,j] else \u0027?\u0027\r\n\r\nprint(h)","5":"import numpy as np, matplotlib.pyplot as plt\r\nfrom collections import Counter\r\n\r\nd=np.random.rand(100)\r\nx,y=d[:50],[\"Class1\" if i\u003c=.5 else \"Class2\" for i in d[:50]]\r\nt=d[50:]\r\n\r\ndef knn(p,k):\r\n    return Counter([y[i] for i in np.argsort(abs(x-p))[:k]]).most_common(1)[0][0]\r\n\r\nfor k in [1,3,5]:\r\n    c=[knn(i,k) for i in t]\r\n    c1=[t[i] for i in range(len(t)) if c[i]==\"Class1\"]\r\n    c2=[t[i] for i in range(len(t)) if c[i]==\"Class2\"]\r\n\r\n    plt.scatter(x,[0]*len(x),c=[\"b\" if i==\"Class1\" else \"r\" for i in y])\r\n    plt.scatter(c1,[1]*len(c1),c=\"b\",marker=\"x\")\r\n    plt.scatter(c2,[1]*len(c2),c=\"r\",marker=\"x\")\r\n    plt.title(f\"k={k}\")\r\n    plt.show()","6":"import numpy as np, matplotlib.pyplot as plt\r\n\r\ng=lambda x,xi,t: np.exp(-np.sum((x-xi)**2)/(2*t**2))\r\n\r\ndef lwr(x,X,y,t):\r\n    W=np.diag([g(x,i,t) for i in X])\r\n    return x @ np.linalg.inv(X.T@W@X) @ X.T @ W @ y\r\n\r\nX=np.linspace(0,2*np.pi,100)\r\ny=np.sin(X)+0.1*np.random.randn(100)\r\n\r\nXb=np.c_[np.ones(len(X)),X]\r\nxt=np.linspace(0,2*np.pi,200)\r\nxtb=np.c_[np.ones(len(xt)),xt]\r\n\r\nyp=[lwr(i,Xb,y,.5) for i in xtb]\r\n\r\nplt.scatter(X,y,c=\u0027r\u0027)\r\nplt.plot(xt,yp)\r\nplt.show()","7":"import pandas as pd, matplotlib.pyplot as plt\r\nfrom sklearn.datasets import fetch_california_housing\r\nfrom sklearn.model_selection import train_test_split\r\nfrom sklearn.linear_model import LinearRegression\r\nfrom sklearn.preprocessing import PolynomialFeatures\r\nfrom sklearn.pipeline import make_pipeline\r\nfrom sklearn.metrics import mean_squared_error,r2_score\r\n\r\nx,y=fetch_california_housing(as_frame=True,return_X_y=True)\r\nx=x[[\"AveRooms\"]]\r\nxtr,xte,ytr,yte=train_test_split(x,y,test_size=.2)\r\n\r\nm=LinearRegression().fit(xtr,ytr)\r\nyp=m.predict(xte)\r\n\r\nplt.scatter(xte,yte)\r\nplt.plot(xte,yp,c=\u0027r\u0027)\r\nplt.show()\r\n\r\nprint(\"Linear:\",mean_squared_error(yte,yp),r2_score(yte,yp))\r\n\r\nd=pd.read_csv(\"https://archive.ics.uci.edu/ml/machine-learning-databases/auto-mpg/auto-mpg.data\",\r\nsep=\u0027\\s+\u0027,na_values=\"?\",header=None).dropna()\r\n\r\nx,y=d[[2]],d[0]\r\nxtr,xte,ytr,yte=train_test_split(x,y,test_size=.2)\r\n\r\nm=make_pipeline(PolynomialFeatures(2),LinearRegression()).fit(xtr,ytr)\r\nyp=m.predict(xte)\r\n\r\nplt.scatter(xte,yte)\r\nplt.scatter(xte,yp,c=\u0027r\u0027)\r\nplt.show()\r\n\r\nprint(\"Polynomial:\",mean_squared_error(yte,yp),r2_score(yte,yp))","8":"import matplotlib.pyplot as plt\r\nfrom sklearn.datasets import load_breast_cancer\r\nfrom sklearn.model_selection import train_test_split\r\nfrom sklearn.tree import DecisionTreeClassifier, plot_tree\r\nfrom sklearn.metrics import accuracy_score\r\n\r\nx,y=load_breast_cancer(return_X_y=True)\r\nxtr,xte,ytr,yte=train_test_split(x,y,test_size=.2,random_state=42)\r\n\r\nm=DecisionTreeClassifier().fit(xtr,ytr)\r\n\r\nprint(\"Accuracy:\",accuracy_score(yte,m.predict(xte))*100)\r\nprint(\"Prediction:\",[\"Malignant\",\"Benign\"][m.predict([xte[0]])[0]])\r\n\r\nplot_tree(m,filled=True)\r\nplt.show()","9":"import matplotlib.pyplot as plt\r\nfrom sklearn.datasets import fetch_olivetti_faces\r\nfrom sklearn.model_selection import train_test_split,cross_val_score\r\nfrom sklearn.naive_bayes import GaussianNB\r\nfrom sklearn.metrics import accuracy_score\r\n\r\nx,y=fetch_olivetti_faces(return_X_y=True,shuffle=True,random_state=42)\r\nxtr,xte,ytr,yte=train_test_split(x,y,test_size=.3)\r\n\r\nm=GaussianNB().fit(xtr,ytr)\r\nyp=m.predict(xte)\r\n\r\nprint(\"Accuracy:\",accuracy_score(yte,yp)*100)\r\nprint(\"CV:\",cross_val_score(m,x,y,cv=5).mean()*100)\r\n\r\nfor i in range(5):\r\n    plt.subplot(1,5,i+1)\r\n    plt.imshow(xte[i].reshape(64,64),cmap=\"gray\")\r\n    plt.title(f\"{yp[i]}\")\r\n    plt.axis(\"off\")\r\n\r\nplt.show()","10":"import pandas as pd, matplotlib.pyplot as plt, seaborn as sns\r\nfrom sklearn.datasets import load_breast_cancer\r\nfrom sklearn.cluster import KMeans\r\nfrom sklearn.preprocessing import StandardScaler\r\nfrom sklearn.decomposition import PCA\r\nfrom sklearn.metrics import confusion_matrix\r\n\r\nx,y=load_breast_cancer(return_X_y=True)\r\n\r\nx=StandardScaler().fit_transform(x)\r\nk=KMeans(2,random_state=42).fit(x)\r\n\r\nprint(confusion_matrix(y,k.labels_))\r\n\r\np=PCA(2).fit_transform(x)\r\ndf=pd.DataFrame(p,columns=[\"PC1\",\"PC2\"])\r\ndf[\"Cluster\"]=k.labels_\r\n\r\nsns.scatterplot(data=df,x=\"PC1\",y=\"PC2\",hue=\"Cluster\")\r\nplt.scatter(*PCA(2).fit(x).transform(k.cluster_centers_).T,s=200,c=\u0027r\u0027,marker=\u0027X\u0027)\r\nplt.show()"};
    const buttons = document.getElementById('buttons');
    const status = document.getElementById('status');

    function setStatus(message, ok) {
      status.textContent = message;
      status.style.color = ok ? 'green' : 'crimson';
    }

    async function copyProgram(number) {
      try {
        await navigator.clipboard.writeText(programs[String(number)]);
        setStatus(`Program ML${number}.py copied.`, true);
      } catch (error) {
        setStatus('Clipboard failed. Try on HTTPS or localhost.', false);
      }
    }

    for (let i = 1; i <= 10; i += 1) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = i;
      btn.addEventListener('click', () => copyProgram(i));
      buttons.appendChild(btn);
    }
  </script>
</body>
</html>
