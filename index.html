<!doctype html>

<head>

  <title>Lab Programs</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(48px, 1fr)); gap: 10px; max-width: 320px; }
    button { padding: 10px 0; font-size: 16px; cursor: pointer; }
    #status { margin-top: 12px; min-height: 1.2em; font-size: 14px; }
  </style>

<body>
  <div class="grid" id="buttons"></div>
  <div id="status" aria-live="polite"></div>

  <script>
    const programs = {"1":"import gensim.downloader as api\r\n\r\nwv = api.load(\"word2vec-google-news-300\")\r\n\r\n# Word analogy\r\ndef relate(a,b,c):\r\n    print(f\"\\n{a} - {b} + {c}\")\r\n    for w,s in wv.most_similar(positive=[a,c],negative=[b],topn=5):\r\n        print(w, round(s,4))\r\n\r\n# Similarity\r\ndef sim(a,b):\r\n    print(f\"\\n{a} \u0026 {b} =\", round(wv.similarity(a,b),4))\r\n\r\n# Similar words\r\ndef similar(w):\r\n    print(f\"\\nSimilar to {w}:\")\r\n    for x,s in wv.most_similar(w,topn=5):\r\n        print(x, round(s,4))\r\n\r\nrelate(\"king\",\"man\",\"woman\")\r\nrelate(\"paris\",\"france\",\"germany\")\r\n\r\nsim(\"cat\",\"dog\")\r\nsim(\"music\",\"art\")\r\n\r\nsimilar(\"happy\")\r\nsimilar(\"technology\")\r\n","2":"# p2a.py\r\nimport gensim.downloader as api, matplotlib.pyplot as plt\r\nfrom sklearn.decomposition import PCA\r\n\r\nwv = api.load(\"word2vec-google-news-300\")\r\n\r\ndef relate(a,b,c):\r\n    r = wv.most_similar(positive=[a,c], negative=[b], topn=5)\r\n    print(f\"\\n{a}-{b}+{c}\")\r\n    for w,s in r: print(w, round(s,4))\r\n    return [a,b,c]+[w for w,_ in r]\r\n\r\nwords = relate(\"king\",\"man\",\"woman\")\r\n\r\nv = [wv[w] for w in words]\r\np = PCA(2).fit_transform(v)\r\n\r\nfor i,w in enumerate(words):\r\n    plt.scatter(p[i,0], p[i,1])\r\n    plt.text(p[i,0], p[i,1], w)\r\n\r\nplt.show()\r\n\r\n# p2b.py\r\nimport gensim.downloader as api, numpy as np, matplotlib.pyplot as plt\r\nfrom sklearn.decomposition import PCA\r\nfrom sklearn.manifold import TSNE\r\n\r\nwv = api.load(\"word2vec-google-news-300\")\r\n\r\nwords = [\"computer\",\"software\",\"hardware\",\"algorithm\",\"data\",\r\n         \"network\",\"programming\",\"machine\",\"learning\",\"artificial\"]\r\n\r\nvec = np.array([wv[w] for w in words])\r\n\r\nfor r,t in [(PCA(2),\"PCA\"),(TSNE(2,perplexity=3),\"TSNE\")]:\r\n    p = r.fit_transform(vec)\r\n\r\n    plt.figure(figsize=(8,6))\r\n    for i,w in enumerate(words):\r\n        plt.scatter(p[i,0],p[i,1])\r\n        plt.text(p[i,0],p[i,1],w)\r\n\r\n    plt.title(t)\r\n    plt.show()\r\n\r\nfor w in [\"computer\",\"learning\"]:\r\n    print(f\"\\nSimilar to {w}:\")\r\n    for x,s in wv.most_similar(w,topn=5):\r\n        print(x, round(s,4))","3":"from gensim.models import Word2Vec\r\nfrom sklearn.manifold import TSNE\r\nimport matplotlib.pyplot as plt, numpy as np\r\n\r\nc = [\r\n\"The patient was diagnosed with diabetes\",\r\n\"MRI scans reveal brain abnormalities\",\r\n\"Treatment involves antibiotics\",\r\n\"Symptoms include fever and fatigue\",\r\n\"The vaccine prevents infections\"\r\n]\r\n\r\nc = [i.lower().split() for i in c]\r\n\r\nm = Word2Vec(c, vector_size=50, min_count=1, epochs=50)\r\n\r\nw = list(m.wv.index_to_key)\r\ne = np.array([m.wv[i] for i in w])\r\n\r\np = TSNE(2, perplexity=3).fit_transform(e)\r\n\r\nfor i,j in enumerate(w):\r\n    plt.scatter(p[i,0],p[i,1])\r\n    plt.text(p[i,0],p[i,1],j)\r\n\r\nplt.show()\r\n\r\nfor x in [\"treatment\",\"vaccine\"]:\r\n    print(f\"\\nSimilar to {x}:\")\r\n    for w,s in m.wv.most_similar(x,topn=5):\r\n        print(w, round(s,2))","4":"import gensim.downloader as api, nltk, string\r\nfrom nltk.tokenize import word_tokenize\r\nfrom transformers import pipeline\r\n\r\nwv = api.load(\"glove-wiki-gigaword-100\")\r\ng = pipeline(\"text-generation\", model=\"gpt2\")\r\n\r\ndef enrich(p,k):\r\n    w=[]\r\n    for i in word_tokenize(p):\r\n        x=i.lower().strip(string.punctuation)\r\n        w.append(wv.most_similar(x,topn=1)[0][0] if x==k else i)\r\n    return \" \".join(w)\r\n\r\np = \"Who is king.\"\r\nep = enrich(p,\"king\")\r\n\r\nprint(\"Original:\",p)\r\nprint(\"Enriched:\",ep)\r\n\r\nprint(\"\\nGPT2 Response:\")\r\nprint(g(p,max_length=50)[0][\"generated_text\"])\r\n\r\nprint(\"\\nEnriched Response:\")\r\nprint(g(ep,max_length=50)[0][\"generated_text\"])","5":"import gensim.downloader as api, random, nltk\r\nnltk.download(\u0027punkt\u0027)\r\n\r\nwv = api.load(\"glove-wiki-gigaword-100\")\r\n\r\ndef para(w):\r\n    try:\r\n        s = [x[0] for x in wv.most_similar(w, topn=5)]\r\n        t = [\r\n            f\"The {w} was surrounded by {s[0]} and {s[1]}.\",\r\n            f\"{w} is linked with {s[2]} and {s[3]}.\",\r\n            f\"In the world of {w}, {s[4]} was common.\",\r\n            f\"A story of {w} needs {s[1]} and {s[3]}.\"\r\n        ]\r\n        return \" \".join(random.choice(t) for _ in range(4))\r\n    except:\r\n        return \"Word not found.\"\r\n\r\nprint(para(input(\"Enter a seed word: \")))","6":"from transformers import pipeline\r\n\r\nsa = pipeline(\"sentiment-analysis\",model=\"distilbert-base-uncased-finetuned-sst-2-english\")\r\n\r\nreviews = [\r\n    \"The product is amazing!\",\r\n    \"The service was terrible.\",\r\n    \"It was average.\",\r\n    \"Fantastic quality!\",\r\n    \"Not great, not bad either.\"\r\n]\r\n\r\nfor r in reviews:\r\n    x = sa(r)[0]\r\n    print(f\"{r} -\u003e {x[\u0027label\u0027]} ({x[\u0027score\u0027]:.2f})\")","7":"from transformers import pipeline\r\n\r\nsummarizer = pipeline(\r\n    \"summarization\",\r\n    model=\"facebook/bart-large-cnn\"\r\n)\r\n\r\ntext = \"\"\"\r\nArtificial Intelligence (AI) is transforming industries like healthcare,\r\nfinance, education, and entertainment. AI systems can learn from data,\r\nsolve problems, and make decisions. Technologies such as machine learning\r\nand deep learning power applications like chatbots, recommendation systems,\r\nand self-driving cars. However, AI also raises ethical concerns including\r\nbias and job displacement.\r\n\"\"\"\r\n\r\nsummary = summarizer(text, max_length=60, min_length=20, do_sample=False)\r\n\r\nprint(summary[0][\"summary_text\"])","8":"import getpass\r\nimport cohere\r\n\r\n# Read file\r\ntext = open(\"Teaching.txt\", encoding=\"utf-8\").read()\r\n\r\n# API key\r\nkey = getpass.getpass(\"Enter Cohere API Key: \")\r\n\r\n# Load Cohere client\r\nclient = cohere.Client(key)\r\n\r\n# Prompt\r\nprompt = f\"\"\"\r\nSummarize this text, give 3 key points, and sentiment.\r\n\r\n{text}\r\n\"\"\"\r\n\r\n# Generate response\r\nresponse = client.generate(model=\"command\", prompt=prompt, max_tokens=300)\r\nprint(response.generations[0].text)","9":"\r\nimport wikipediaapi\r\n\r\nimport ipywidgets as w\r\nfrom IPython.display import display\r\n\r\n# Per Wikimedia policy, use a descriptive user agent (app/version + contact or URL).\r\nwiki = wikipediaapi.Wikipedia(\r\n    user_agent=\"InstitutionLookupBot/1.0 (https://example.com/contact)\",\r\n    language=\"en\",\r\n)\r\n\r\ndef fetch(b):\r\n    p = wiki.page(t.value)\r\n\r\n    if not p.exists():\r\n        print(\"Page not found\")\r\n        return\r\n\r\n    print(\"Summary:\\n\", p.summary[:500])\r\n\r\n    for i in p.text.split(\"\\n\"):\r\n        if \"Founder\" in i or \"Founded\" in i:\r\n            print(i)\r\n\r\nt = w.Text(placeholder=\"Enter institution\")\r\nb = w.Button(description=\"Fetch\")\r\n\r\nb.on_click(fetch)\r\n\r\ndisplay(t,b)\r\n","10":"from cohere import Client\r\nimport wikipediaapi\r\nimport ipywidgets as w\r\nfrom IPython.display import display\r\nimport getpass\r\n\r\nco = Client(getpass.getpass(\"Cohere API Key: \"))\r\n\r\nwiki = wikipediaapi.Wikipedia(user_agent=\"App\", language=\"en\")\r\nipc = wiki.page(\"Indian Penal Code\").summary[:3000]\r\n\r\ndef ask(b):\r\n    q = t.value\r\n\r\n    r = co.generate(\r\n        model=\"command\",\r\n        prompt=f\"IPC:\\n{ipc}\\n\\nQuestion:{q}\\nAnswer:\",\r\n        max_tokens=120\r\n    )\r\n\r\n    print(r.generations[0].text)\r\n\r\nt = w.Text(placeholder=\"Ask about IPC\")\r\nb = w.Button(description=\"Ask\")\r\n\r\nb.on_click(ask)\r\n\r\ndisplay(t,b)"};
    const buttons = document.getElementById('buttons');
    const status = document.getElementById('status');
function setStatus(message, ok) {
      status.textContent = message;
      status.style.color = ok ? 'green' : 'crimson';
    }

    async function copyProgram(number) {
      try {
        await navigator.clipboard.writeText(programs[String(number)]);
        setStatus(`Program p${number}.py copied.`, true);
      } catch (error) {
        setStatus('Clipboard failed. Try on HTTPS or localhost.', false);
      }
    }

    for (let i = 1; i <= 10; i += 1) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = `p${i}`;
      btn.addEventListener('click', () => copyProgram(i));
      buttons.appendChild(btn);
    }
  </script>
</body>
</html>
