<!doctype html>
<!-- Static clipboard page: sources are embedded so it works from GitHub Pages and local servers. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab Programs</title>
  <style>
    body { font-family: sans-serif; margin: 24px; }
    .grid { display: grid; grid-template-columns: repeat(5, minmax(48px, 1fr)); gap: 10px; max-width: 320px; }
    button { padding: 10px 0; font-size: 16px; cursor: pointer; }
    #status { margin-top: 12px; min-height: 1.2em; font-size: 14px; }
  </style>
</head>
<body>
  <div class="grid" id="buttons" aria-label="Lab program buttons"></div>
  <div id="status" aria-live="polite"></div>

  <script>
    const programs = {"1":"#include<stdlib.h>\n#include<stdio.h>\n#include<omp.h>\n#define N 100000\nvoid merge(int a[],int l, int m, int r)\n{\n    int t[r-l+1],i=l,j=m+1,k=0;\n\n    while(i<=m and j<=r)\n    {\n        t[k++]=a[i]<=a[j]?a[i++]:a[j++];\n    }\n\n    while (i<=m)\n    {\n        t[k++]=a[i++];\n    }\n    while(j<=r)\n    {\n        t[k++]=a[j++];\n    }\n\n    for(i=l;i<=r;i++)\n    {\n        a[i]=t[i-l];\n    }\n}\n\nvoid sort(int a[],int l, int r, int parallel)\n{\n    if(l>=r) return;\n    m=(l+r)/2\n\n    if(parallel && r-l>2000)\n    {\n        #pragma omp task shared(a)\n        sort(a,l,m,1);\n        sort(a,m+1,r,1);\n        #pragma omp taskwait\n    }\n    else{\n        sort(a,l,m,0);\n        sort(a,m+1,r,0);\n    }\n    merge(a,l,m,r);\n}\n\nvoid main()\n{\n    int a=[N],b[N];\n    for( int i=0;i<N;i++) a[i]=b[N]=rand()%N;\n\n    double t=omp_get_wtime();\n    sort(a,0,N,0);\n    double serial=omp_get_wtime()-t;\n\n    t=omp_get_wtime();\n    sort(b,0,N,1);\n    double parallel=omp_get_wtime()-t;\n\n    printf(\"Serial:%f. \\nParallel:%f.\",serial,parallel);\n}","2":"#include<stdio.h>\n#include<omp.h>\n#include<stdlib.h>\n\nint main(int argc, char* argv[])\n{\n    int n=argc>1?atoi(argv[1]):0;\n    if (n<1) return 1;\n\n    int owner[n];\n    #pragma omp parallel for schedule(static,2)\n    for(int i=0;i<n;i++)\n    {\n        owner[i]=omp_get_thread_num();\n    }\n    for(int i=0;i<n;i+=2)\n    {\n        printf(\"Thread: %d. Iterations %d---%d\",owner[i],i,i+1<n?i+1:i);\n    }\n    \n}","3":"#include<stdio.h>\n#include<stdlib.h>\n#include<omp.h>\n\nlong long fib(int n)\n{\n    if (n<2) return 1;\n\n    long long x,y;\n\n    #pragma omp task shared(x)\n    x=fib(n-1);\n    #pragma opm task shared(y)\n    y=fib(n-2);\n\n    #pragma omp taskwait\n    return x+y;\n}\n\nint main(argc,char **argv[])\n{\n    int n=argc>1?atoi(argv[1]): 10;\n\n    #pragma omp parallel\n    #pragma omp single\n    for(int i=0;i<n:i++)\n    {\n        printf(\"Fib(%d)=%lld \\n\",i,fib(i));\n    }\n}","4":"\n#include <stdio.h>\n#include <stdlib.h>\n#include <omp.h>\n\nint prime(int n) {\n    if(n<2) return 0;\n\n    for(int i=2;i*i<=n;i++) {\n        if(n%i==0) return 0;\n    }\n    return 1;\n}\n\nint main(int argc, char **argv) {\n    if(argc<2) return 1;\n\n    int n=atoi(argv[1]);\n    if(n<2) return 1;\n\n    int serial_primes[n], parallel_primes[n];\n    int count=0, pc=0;\n\n    double t=omp_get_wtime();\n\n    for(int i=1;i<=n;i++) {\n        if(prime(i))\n            serial_primes[count++]=i;\n    }\n\n    double serial=omp_get_wtime()-t;\n\n    t=omp_get_wtime();\n\n    #pragma omp parallel for schedule(static)\n    for(int i=1;i<=n;i++) {\n        parallel_primes[i-1]=prime(i) ? i : 0;\n    }\n\n    double parallel=omp_get_wtime()-t;\n\n    printf(\"Serial: \");\n    for(int i=0;i<count;i++)\n        printf(\"%d \",serial_primes[i]);\n\n    printf(\"\\nSerial time: %f\\n\",serial);\n\n    printf(\"Parallel: \");\n    for(int i=0;i<n;i++) {\n        if(parallel_primes[i]) {\n            printf(\"%d \",parallel_primes[i]);\n            pc++;\n        }\n    }\n\n    printf(\"\\nParallel time: %f\\n\",parallel);\n    printf(\"Primes found: serial=%d, parallel=%d\\n\",\n           count,pc);\n}\n","5":"#include <stdio.h>\n#include <mpi.h>\n\nint main(int argc, char **argv)\n{\n    MPI_Init(&argc,&argv);\n\n    int rank,msg=123;\n    MPI_Comm_rank(MPI_COMM_WORLD,&rank);\n\n    if(rank==0)\n    {\n        MPI_Send(&msg,1,MPI_INT,1,0,MPI_COMM_WORLD);\n        printf(\"Process %d sent message %d to process 1\\n\",rank,msg);\n    }\n    else if(rank==1)\n    {\n        MPI_Recv(&msg,1,MPI_INT,0,0,MPI_COMM_WORLD,MPI_STATUS_IGNORE);\n        printf(\"Process %d received message %d from process 0\\n\",rank,msg);\n    }\n\n    MPI_Finalize();\n    return 0;\n}\n","6":"#include<stdio.h>\n#include<mpi.h>\n\n\n//part a\nint main()\n{\n    MPI_Init(NULL,NULL);\n    int rank,msg=100;\n    MPI_Comm_rank(MPI_COMM_WORLD,&rank;)\n\n    if(rank==0)\n    {\n        MPI_Ssend(&msg,1,MPI_INT,1,0,MPI_COMM_WORLD);\n        MPI_recv(&msg,1,MPI_INT,1,0,MPI_COMM_WORLD,MPI_STATUS_IGNORE);\n    }\n\n    else\n    {\n        MPI_Ssend(&msg,1,MPI_INT,0,0,MPI_COMM_WORLD);\n        MPI_Recv(&msg,1,MPI_INT,0,0,MPI_COMM_WORLD,MPI_STATUS_IGNORE);\n    }\n    MPI_Finalise();\n    return 0;\n}\n\n//part b\n#include<stdio.h>\n#include<mpi.h>\nint main()\n{\n    MPI_Init(NULL,NULL);\n    int rank,msg=100;\n    MPI_Comm_rank(MPI_COMM_WORLD,&rank);\n\n    if(rank==0)\n    {\n        MPI_Send(&msg,1,MPI_INT,1,0,MPI_COMM_WORLD);\n        MPI_recv(&msg,1,MPI_INT,1,0,MPI_COMM_WORLD,MPI_STATUS_IGNORE);\n    }\n    else\n    {\n        MPI_Send(&msg,1,MPI_INT,0,0,MPI_COMM_WORLD);\n        MPI_Recv(&msg,1,MPI_INT,0,0,MPI_COMM_WORLD,MPI_STATUS_IGNORE);\n    }\n    MPI_Finalise();\n    printf(\"Process %d received %d\",rank,msg);\n    return 0;\n}","7":"#include<stdio.h>\n#include<mpi.h>\n\nint main()\n{\n    MPI_Init(NULL,NULL);\n    int rank,msg;\n\n    MPI_Comm_rank(MPI_COMM_WORLD,&rank);\n\n    if(rank==0)\n    {\n        msg=67;\n        printf(\"Process 0 is broadcasting data 67\");\n    }\n\n    MPI_Bcast(&data,1,MPI_INT,0,MPI_COMM_WORLD);\n    MPI_Finalise();\n    printf(\"Process %d received %d\",rank,data);\n    return 0;\n}","8":"#include<stdio.h>\n#include<mpi.h>\n\nint main()\n{\n    int rank,a[100],parts[10],result[100];\n\n    MPI_Init(NULL,NULL);\n    MPI_Comm_rank(MPI_COMM_WORLD,&rank);\n\n    if(rank==0)\n    {\n        for(int i=0;i<100;i++) a[i]=i+1;\n    }\n\n    MPI_Scatter(a,10,MPI_INT,part,10,MPI_INT,0,MPI_COMM_WORLD);\n\n    for(int i=0;i<10;i++) part[i]*=2;\n\n    MPI_Gather(part,10,MPI_INT,result,10,MPI_INT,0,MPI_COMM_WORLD);\n\n    if(rank==0)\n    {\n        for(int i=0;i<100;i++)\n        {\n            printf(\"%d\\t\",result[i]);\n        }\n    }\n    MPI_Finalize();\n    return 0;\n}","9":"#include<stdio.h>\n#include<mpi.h>\n\nint main()\n{\n    MPI_Init(NULL,NULL);\n\n    int rank,reduced[4],all[4],value=2;\n    char *names[4]={\"SUM\",\"PROD\",\"MAX\",\"MIN\"};\n    MPI_Comm_rank(MPI_COMM_WORLD,&rank);\n    MPI_Op op[4]={MPI_SUM,MPI_PROD,MPI_MAX,MPI_MIN};\n    \n    for(int i=0;i<4;i++)\n    {\n        MPI_Reduce(&value,&reduced[i],1,MPI_INT,op[i],0,MPI_COMM_WORLD);\n        MPI_Allreduce(&value,&all[i],1,MPI_INT,op[i],MPI_COMM_WORLD);\n    }\n    if(rank==0) {\n        puts(\"=== MPI_Reduce Results (on root only) ===\");\n        for(int i=0;i<4;i++)\n            printf(\"%s = %d\\n\",names[i],reduced[i]);\n    }\n    printf(\"Process %d: Allreduce Results: SUM=%d, PROD=%d, MAX=%d, MIN=%d\\n\",\n           rank,all[0],all[1],all[2],all[3]);\n\n    MPI_Finalize();\n\n}"};
    const buttons = document.getElementById('buttons');
    const status = document.getElementById('status');

    /** Updates the live status message after a copy attempt. */
    function setStatus(message, isSuccessful) {
      status.textContent = message;
      status.style.color = isSuccessful ? 'green' : 'crimson';
    }

    /** Copies one requested C program to the system clipboard. */
    async function copyProgram(programNumber) {
      const programSource = programs[String(programNumber)];

      if (!programSource) {
        setStatus('Program source is unavailable.', false);
        return;
      }

      try {
        await navigator.clipboard.writeText(programSource);
        setStatus(`Program p${programNumber}.c copied.`, true);
      } catch (error) {
        setStatus('Clipboard failed. Try on HTTPS or localhost.', false);
      }
    }

    for (let i = 1; i <= 9; i += 1) {
      const button = document.createElement('button');
      button.type = 'button';
      button.textContent = `p${i}`;
      button.addEventListener('click', () => copyProgram(i));
      buttons.appendChild(button);
    }
  </script>
</body>
</html>
